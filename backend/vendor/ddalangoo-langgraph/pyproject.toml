[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ddalangoo-agent"
version = "0.1.0"
description = "딸랑구 쇼핑 어시스턴트 — Standalone LangGraph Agent System"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
    "anthropic>=0.40.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "langsmith>=0.2.0",
    "langchain-ollama>=0.2.0",
    "deepeval>=1.5.0",
]

[project.optional-dependencies]
# 로컬 eval 대시보드 전용 (evals/dashboard.py) — LangSmith 없이
# evals/local_runner.py 결과를 시각 비교하는 개발용 도구.
dev = [
    "streamlit>=1.38.0",
]

[project.scripts]
ddalangoo = "main:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
addopts = "-m 'not llm_smoke'"
markers = [
    "llm_smoke: 실 LLM API를 호출하는 구조화출력 스모크 테스트 (기본 실행에서 제외, `pytest -m llm_smoke`로 수동 실행)",
]
